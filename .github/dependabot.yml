# Weekly Dependabot updates: GitHub Actions and npm (dev deps grouped).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(ci)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
    # All lukislp/ci-workflows bumps share one PR, so they take one slot of the
    # limit and other actions (e.g. harden-runner) are not starved by them.
    groups:
      ci-workflows:
        patterns:
          - "lukislp/ci-workflows*"
      # init, analyze and upload-sarif must run the same version - one PR for all.
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      dev:
        dependency-type: development
    commit-message:
      prefix: "fix(deps)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
    ignore:
      # @types/vscode must not be newer than engines.vscode (vsce refuses to package);
      # bump both together by hand when raising the minimum VS Code version.
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
